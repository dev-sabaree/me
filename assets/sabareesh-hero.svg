<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Sabareesh K. - Flutter Developer, Full-Stack Developer, and AI Enthusiast</title>
  <desc id="desc">A dark cyber blue developer profile banner with a subtle moving light sweep and technical grid.</desc>
  <defs>
    <linearGradient id="hero-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#00E5FF" stop-opacity="0.15"/>
      <stop offset="0.52" stop-color="#F1F5F9" stop-opacity="0.48"/>
      <stop offset="0.58" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00E5FF"/>
      <stop offset="0.78" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hero-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#253247" stroke-width="1" opacity="0.52"/>
    </pattern>
    <filter id="hero-glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="#080B10"/>
  <rect width="1200" height="400" fill="url(#hero-grid)"/>
  <path d="M0 322 H1200 M0 72 H1200" stroke="#253247" stroke-width="1" opacity="0.65"/>
  <path d="M810 0 V400 M1008 0 V400" stroke="#253247" stroke-width="1" opacity="0.55"/>

  <g fill="none" stroke-linecap="round">
    <path d="M780 300 C870 238 888 164 972 152 S1085 216 1200 98" stroke="#38BDF8" stroke-width="1.5" opacity="0.52" stroke-dasharray="9 12">
      <animate attributeName="stroke-dashoffset" values="0;-84" dur="13s" repeatCount="indefinite"/>
    </path>
    <path d="M790 326 C905 270 960 340 1082 276 S1160 218 1230 226" stroke="#00E5FF" stroke-width="1" opacity="0.38" stroke-dasharray="4 14">
      <animate attributeName="stroke-dashoffset" values="0;72" dur="16s" repeatCount="indefinite"/>
    </path>
    <circle cx="972" cy="152" r="4" fill="#00E5FF" opacity="0.8" filter="url(#hero-glow)">
      <animate attributeName="opacity" values="0.38;0.9;0.38" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(-320 0)" opacity="0.78">
    <rect x="0" y="0" width="190" height="400" fill="url(#hero-sweep)" transform="skewX(-18)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1720 0" dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(86 112)">
    <text x="0" y="0" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="3">// DEVELOPER PROFILE</text>
    <text x="0" y="72" fill="#F1F5F9" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="2">SABAREESH K.</text>
    <path d="M0 99 H474" stroke="url(#hero-line)" stroke-width="2" filter="url(#hero-glow)"/>
    <text x="0" y="145" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="1.25">FLUTTER DEVELOPER · FULL-STACK DEVELOPER · AI ENTHUSIAST</text>
  </g>

  <g transform="translate(1080 64)" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1.5">
    <text x="0" y="0">BUILD</text>
    <text x="0" y="20">REFINE</text>
    <text x="0" y="40" fill="#00E5FF">LEARN</text>
  </g>
</svg>
